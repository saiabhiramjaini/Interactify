name: Build and deploy on Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  build-and-push:
    # Never deploy a server that fails to build or test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: saiabhiramjaini/interactify-server:latest

      - name: verify Docker image
        run: docker pull saiabhiramjaini/interactify-server:latest

      # Kafka stays disabled on the t2.micro (ENABLE_KAFKA defaults to false).
      # ALLOWED_ORIGINS may be left unset to accept WebSocket connections from any origin.
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo docker pull saiabhiramjaini/interactify-server:latest
            sudo docker stop interactify-server || true
            sudo docker rm interactify-server || true
            sudo docker run -d -p 8000:8000 \
              -e PORT=${{ secrets.ENV_PORT }} \
              -e MONGO_URI=${{ secrets.ENV_MONGO_URI }} \
              -e REDIS_HOST=${{ secrets.ENV_REDIS_HOST }} \
              -e REDIS_PORT=${{ secrets.ENV_REDIS_PORT }} \
              -e ALLOWED_ORIGINS="${{ secrets.ENV_ALLOWED_ORIGINS }}" \
              --name interactify-server saiabhiramjaini/interactify-server:latest
