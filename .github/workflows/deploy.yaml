name: Deploy server to phone

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:

# Never run two deploys against the phone at once
concurrency:
  group: deploy-phone
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./server

      - name: Build
        run: npm run build
        working-directory: ./server

      # Nothing reaches the phone unless the tests pass
      - name: Test
        run: npm test
        working-directory: ./server

      # The phone runs this exact build; it only installs production dependencies
      - name: Package build
        run: tar czf "$RUNNER_TEMP/dist.tgz" -C server dist

      - name: Install cloudflared
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared
          cloudflared --version

      # SSH reaches the phone through the Cloudflare tunnel, authenticated by an
      # Access service token (see deploy/README.md for the one-time setup)
      - name: Configure SSH
        env:
          PHONE_SSH_HOST: ${{ secrets.PHONE_SSH_HOST }}
          PHONE_SSH_USER: ${{ secrets.PHONE_SSH_USER }}
          PHONE_SSH_KEY: ${{ secrets.PHONE_SSH_KEY }}
          PHONE_SSH_KNOWN_HOSTS: ${{ secrets.PHONE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PHONE_SSH_KEY" > ~/.ssh/phone_key
          chmod 600 ~/.ssh/phone_key
          printf '%s\n' "$PHONE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host phone
            HostName $PHONE_SSH_HOST
            User $PHONE_SSH_USER
            IdentityFile ~/.ssh/phone_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ProxyCommand cloudflared access ssh --hostname %h --id "\$CF_ACCESS_CLIENT_ID" --secret "\$CF_ACCESS_CLIENT_SECRET"
          EOF

      - name: Deploy
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          scp -q "$RUNNER_TEMP/dist.tgz" phone:interactify-dist.tgz
          ssh phone 'bash -s' -- "$GITHUB_SHA" < deploy/deploy.sh
